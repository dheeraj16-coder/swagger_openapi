openapi: 3.0.3
info:
  contact:
    url: https://restcountries.com/support
  description: |
    Read-only country data API. All endpoints are GET, JSON-only, and follow a JSON:API-like envelope: successful payloads sit under a top-level `data` key with `data.objects` (array of Country records) and `data.meta` (pagination block). Failures return an `errors` array of objects carrying a `message`. Authentication is a bearer API key. Spec written against https://restcountries.com/docs/countries (July 2026) and cross-checked against a live v5 record.
  title: REST Countries — Countries API (v5)
  version: 5.0.0
servers:
- url: https://api.restcountries.com/countries/v5
security:
- bearerAuth: []
paths:
  /:
    get:
      description: |
        Returns a paginated list of all countries, sorted ascending by names.common. `q` free-text searches every searchable property (substring, case-insensitive). Arbitrary searchable properties may also be supplied as extra query parameters (e.g. `region=Europe`, `memberships.eu=1`); all clauses AND together. Those dynamic property filters cannot be modeled in OpenAPI 3.0 — pass them via the generated client's raw query-parameter escape hatch if needed.
      operationId: listCountries
      parameters:
      - description: Free-text substring search across searchable properties. Explicitly
          empty `q` returns 400.
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: Page size. 1–100 on the free plan (up to 500 on paid plans).
          Defaults to 25.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: Records to skip before returning. Out-of-bounds offsets return
          an empty objects array with status 200.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: |
          Comma-separated allowlist of dot-path properties to include in each returned object; when set, objects carry only those keys.
        example: "names.common,codes.alpha_2,flag.emoji"
        explode: true
        in: query
        name: response_fields
        required: false
        schema:
          type: string
        style: form
      - description: |
          Comma-separated blocklist of dot-path properties to drop from each returned object. Composes with response_fields; omit wins on conflict.
        example: names.translations
        explode: true
        in: query
        name: response_fields_omit
        required: false
        schema:
          type: string
        style: form
      - description: Pretty-print the JSON response. Bare flag or truthy values enable.
        explode: true
        in: query
        name: pretty
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryListResponse"
          description: Paginated country records.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Malformed request (empty q, out-of-range limit, or other validation\
            \ failure)."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Missing, unrecognized, revoked, or expired API key."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Account frozen (monthly limit exceeded) or premium field used
            on the free plan.
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Edge rate limiter tripped (sustained traffic above 20 requests
            per 10 seconds).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unhandled server error.
      summary: "List all countries (paginated), optionally narrowed by free-text search\
        \ and property filters"
  /{property}:
    get:
      description: |
        Substring search (case-insensitive) within one searchable property, e.g. `/names.common?q=ger`. If `{property}` is a named aggregate (`name` or `code`), the search fans out across that aggregate's underlying property list. Empty `q` returns 400; a non-existent or non-searchable property returns 404. Premium properties (e.g. `leaders`) return 403 on the free plan.
      operationId: searchCountriesByProperty
      parameters:
      - description: |
          A searchable property dot-path (e.g. `names.common`, `capitals`, `currencies`) or an aggregate name (`name`, `code`).
        example: names.common
        explode: false
        in: path
        name: property
        required: true
        schema:
          type: string
        style: simple
      - description: "Search term (substring, case-insensitive). Required; empty returns\
          \ 400."
        explode: true
        in: query
        name: q
        required: true
        schema:
          minLength: 1
          type: string
        style: form
      - description: Page size. 1–100 on the free plan (up to 500 on paid plans).
          Defaults to 25.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: Records to skip before returning. Out-of-bounds offsets return
          an empty objects array with status 200.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: |
          Comma-separated allowlist of dot-path properties to include in each returned object; when set, objects carry only those keys.
        example: "names.common,codes.alpha_2,flag.emoji"
        explode: true
        in: query
        name: response_fields
        required: false
        schema:
          type: string
        style: form
      - description: |
          Comma-separated blocklist of dot-path properties to drop from each returned object. Composes with response_fields; omit wins on conflict.
        example: names.translations
        explode: true
        in: query
        name: response_fields_omit
        required: false
        schema:
          type: string
        style: form
      - description: Pretty-print the JSON response. Bare flag or truthy values enable.
        explode: true
        in: query
        name: pretty
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryListResponse"
          description: Countries whose property contains the search term.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Malformed request (empty q, out-of-range limit, or other validation\
            \ failure)."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Missing, unrecognized, revoked, or expired API key."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Account frozen (monthly limit exceeded) or premium field used
            on the free plan.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unknown endpoint, or the property/aggregate is not readable/searchable."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Edge rate limiter tripped (sustained traffic above 20 requests
            per 10 seconds).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unhandled server error.
      summary: Substring search within a single searchable property or a named aggregate
  /{property}/{value}:
    get:
      description: |
        Exact match (case-insensitive) of `{value}` against `{property}`. Works for unique identifiers (`codes.alpha_2/CA`, `names.common/Canada`), group properties (`region/Europe`), and reverse lookups on array fields (`borders/CAN`, `currencies/CAD`, `calling_codes/44`). `+` and `%20` both decode as spaces. Optional `q` further substring-narrows the matched set. Returns 404 for non-existent or non-readable properties (e.g. `population`, `flag.emoji`).
      operationId: getCountriesByPropertyValue
      parameters:
      - description: A readable property dot-path.
        example: codes.alpha_3
        explode: false
        in: path
        name: property
        required: true
        schema:
          type: string
        style: simple
      - description: Exact value to match (case-insensitive).
        example: CAN
        explode: false
        in: path
        name: value
        required: true
        schema:
          type: string
        style: simple
      - description: Free-text substring search across searchable properties. Explicitly
          empty `q` returns 400.
        explode: true
        in: query
        name: q
        required: false
        schema:
          type: string
        style: form
      - description: Page size. 1–100 on the free plan (up to 500 on paid plans).
          Defaults to 25.
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 25
          maximum: 500
          minimum: 1
          type: integer
        style: form
      - description: Records to skip before returning. Out-of-bounds offsets return
          an empty objects array with status 200.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
      - description: |
          Comma-separated allowlist of dot-path properties to include in each returned object; when set, objects carry only those keys.
        example: "names.common,codes.alpha_2,flag.emoji"
        explode: true
        in: query
        name: response_fields
        required: false
        schema:
          type: string
        style: form
      - description: |
          Comma-separated blocklist of dot-path properties to drop from each returned object. Composes with response_fields; omit wins on conflict.
        example: names.translations
        explode: true
        in: query
        name: response_fields_omit
        required: false
        schema:
          type: string
        style: form
      - description: Pretty-print the JSON response. Bare flag or truthy values enable.
        explode: true
        in: query
        name: pretty
        required: false
        schema:
          type: boolean
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryListResponse"
          description: Countries whose property equals the value.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Malformed request (empty q, out-of-range limit, or other validation\
            \ failure)."
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Missing, unrecognized, revoked, or expired API key."
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Account frozen (monthly limit exceeded) or premium field used
            on the free plan.
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: "Unknown endpoint, or the property/aggregate is not readable/searchable."
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Edge rate limiter tripped (sustained traffic above 20 requests
            per 10 seconds).
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Unhandled server error.
      summary: Read countries by exact property value
components:
