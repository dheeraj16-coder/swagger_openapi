      description: "Search term (substring, case-insensitive). Required; empty returns\
        \ 400."
      explode: true
      in: query
      name: q
      required: true
      schema:
        minLength: 1
        type: string
      style: form
    limit:
      description: Page size. 1–100 on the free plan (up to 500 on paid plans). Defaults
        to 25.
      explode: true
      in: query
      name: limit
      required: false
      schema:
        default: 25
        maximum: 500
        minimum: 1
        type: integer
      style: form
    offset:
      description: Records to skip before returning. Out-of-bounds offsets return
        an empty objects array with status 200.
      explode: true
      in: query
      name: offset
      required: false
      schema:
        default: 0
        minimum: 0
        type: integer
      style: form
    responseFields:
      description: |
        Comma-separated allowlist of dot-path properties to include in each returned object; when set, objects carry only those keys.
      example: "names.common,codes.alpha_2,flag.emoji"
      explode: true
      in: query
      name: response_fields
      required: false
      schema:
        type: string
      style: form
    responseFieldsOmit:
      description: |
        Comma-separated blocklist of dot-path properties to drop from each returned object. Composes with response_fields; omit wins on conflict.
      example: names.translations
      explode: true
      in: query
      name: response_fields_omit
      required: false
      schema:
        type: string
      style: form
    pretty:
      description: Pretty-print the JSON response. Bare flag or truthy values enable.
      explode: true
      in: query
      name: pretty
      required: false
      schema:
        type: boolean
      style: form
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Malformed request (empty q, out-of-range limit, or other validation\
        \ failure)."
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Missing, unrecognized, revoked, or expired API key."
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Account frozen (monthly limit exceeded) or premium field used on
        the free plan.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Unknown endpoint, or the property/aggregate is not readable/searchable."
    TooManyRequests:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Edge rate limiter tripped (sustained traffic above 20 requests
        per 10 seconds).
    ServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Unhandled server error.
