receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: 'countries-api'
          scrape_interval: 15s
          static_configs:
            - targets: ['localhost:8080']

exporters:
  prometheusremotewrite:
    endpoint: "https://aps-workspaces.us-east-1.amazonaws.com/workspaces/ws-8d9350e4-3cab-418d-8237-e234caf1d31f/api/v1/remote_write"
    auth:
      authenticator: sigv4auth

extensions:
  sigv4auth:
    region: "us-east-1"
    service: "aps"
  health_check:
    endpoint: "localhost:13133"

service:
  extensions: [sigv4auth, health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      exporters: [prometheusremotewrite]
