openapi: 3.0.0
info:
  description: OpenAPI specification for the Gin countries backend. Country records are v5-shaped (proxied
    from REST Countries v5 and returned as a bare JSON array, envelope unwrapped by the backend).
  title: Countries Backend API
  version: 2.0.0
servers:
- url: /v3.1
  description: Routing prefix served via nginx (path name is historical)
tags:
- description: API for retrieving country information
  name: Countries
paths:
  /all:
    get:
      description: Returns a simple example response.
      operationId: getAllCountries
      parameters:
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: true
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response
      summary: GET endpoint for retrieving all countries
      tags:
      - Countries
  /independent:
    description: Returns countries filtered by sovereignty (v5 classification.sovereign)
    get:
      operationId: getIndependentCountries
      parameters:
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      - description: Sovereignty status to filter by (maps to v5 classification.sovereign)
        explode: true
        in: query
        name: status
        required: true
        schema:
          example: false
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response
      summary: Get sovereign (independent) countries
      tags:
      - Countries
  /name/{name}:
    get:
      operationId: getCountryByName
      parameters:
      - description: The name of the country to search for
        explode: false
        in: path
        name: name
        required: true
        schema:
          example: United States of America
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      - description: Whether to perform a full-text search
        explode: true
        in: query
        name: fullText
        required: false
        schema:
          type: boolean
        style: form
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by country name. If you want to get an exact match, use the next endpoint. It can
        be the common or official value
      tags:
      - Countries
  /alpha/{code}:
    get:
      operationId: getCountryByCode
      parameters:
      - description: The country code to search ,for example for moldova 2-letter code i.e cca2  = MD,
          3-letter code i.e cca3 and cioc= MDA, numeric code  i.e ccn3=498
        explode: false
        in: path
        name: code
        required: true
        schema:
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by country code. It can be the 2-letter or 3-letter code
      tags:
      - Countries
  /currency/{currency}:
    get:
      operationId: getCountryByCurrency
      parameters:
      - description: The currency code to search for
        explode: false
        in: path
        name: currency
        required: true
        schema:
          example: USD
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by currency code
      tags:
      - Countries
  /lang/{language}:
    get:
      operationId: getCountryByLanguage
      parameters:
      - description: The language code to search for
        explode: false
        in: path
        name: language
        required: true
        schema:
          example: en
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by language code
      tags:
      - Countries
  /capital/{capital}:
    get:
      operationId: getCountryByCapital
      parameters:
      - description: The capital city name to search for
        explode: false
        in: path
        name: capital
        required: true
        schema:
          example: Washington, D.C.
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by capital city name
      tags:
      - Countries
  /region/{region}:
    get:
      operationId: getCountryByRegion
      parameters:
      - description: The region name to search for
        explode: false
        in: path
        name: region
        required: true
        schema:
          example: Americas
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by region name
      tags:
      - Countries
  /subregion/{subregion}:
    get:
      operationId: getCountryBySubregion
      parameters:
      - description: The subregion name to search for
        explode: false
        in: path
        name: subregion
        required: true
        schema:
          example: Northern America
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by subregion name
      tags:
      - Countries
  /translation/{translation}:
    get:
      operationId: getCountryByTranslation
      parameters:
      - description: The translation name to search for
        explode: false
        in: path
        name: translation
        required: true
        schema:
          example: Estados Unidos
          type: string
        style: simple
      - description: Comma-separated list of v5 dot-path fields to include in the response (forwarded
          upstream as response_fields)
        explode: false
        in: query
        name: fields
        required: false
        schema:
          items:
            example: names,capitals,area.kilometers,population,flag
            type: string
          type: array
        style: simple
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allresponsebody'
          description: Successful response with country details
      summary: Search by translation name
      tags:
      - Countries
components:
  schemas:
    Allresponsebody:
      type: array
      items:
        $ref: '#/components/schemas/Country'
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              message:
                type: string
    Country:
      type: object
      description: 'A country record. Every field is optional at the wire level because response_fields
        / response_fields_omit can project the object to any subset.

        '
      properties:
        names:
          $ref: '#/components/schemas/Names'
        capitals:
          type: array
          items:
            $ref: '#/components/schemas/Capital'
        demonyms:
          type: object
          description: Keyed by ISO 639-3 language code.
          additionalProperties:
            $ref: '#/components/schemas/Demonym'
        codes:
          $ref: '#/components/schemas/Codes'
        flag:
          $ref: '#/components/schemas/Flag'
        region:
          type: string
          description: Africa, Americas, Asia, Europe, Oceania.
        subregion:
          type: string
        continents:
          type: array
          items:
            type: string
        landlocked:
          type: boolean
        borders:
          type: array
          description: ISO alpha-3 codes of land-border neighbours.
          items:
            type: string
        area:
          type: object
          properties:
            kilometers:
              type: number
            miles:
              type: number
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        timezones:
          type: array
          description: UTC offsets observed (e.g. UTC+05:30).
          items:
            type: string
        population:
          type: integer
          format: int64
          description: Top-level integer (verified against a live v5 record). Dynamic, 4-hour sync.
        economy:
          type: object
          properties:
            gini_coefficient:
              type: object
              description: Gini coefficient(s) keyed by reporting year.
              additionalProperties:
                type: number
        languages:
          type: array
          description: 'Languages used in the country. `name` (English name) verified as a live lookup
            path; the identifier key names below follow the docs'' description (ISO 639 identifiers, BCP
            47 tag, native name) and should be confirmed against one live record before relying on them
            (x-unverified).

            '
          items:
            $ref: '#/components/schemas/Language'
        currencies:
          type: array
          description: 'Officially supported currencies. `code` verified as a live lookup path; `name`/`symbol`
            follow convention and should be confirmed against one live record (x-unverified).

            '
          items:
            $ref: '#/components/schemas/Currency'
        calling_codes:
          type: array
          items:
            type: string
        tlds:
          type: array
          items:
            type: string
        cars:
          type: object
          properties:
            driving_side:
              type: string
              enum:
              - left
              - right
            signs:
              type: array
              items:
                type: string
        postal_code:
          type: object
          properties:
            format:
              type: string
              description: Human-readable mask, `#` for digits (e.g. "A#A
            regex:
              type: string
        date:
          $ref: '#/components/schemas/DateConventions'
        number_format:
          type: object
          properties:
            decimal_separator:
              type: string
            thousands_separator:
              type: string
        units:
          type: object
          properties:
            measurement_system:
              type: string
              enum:
              - metric
              - imperial
            temperature_scale:
              type: string
              enum:
              - Celsius
              - Fahrenheit
        classification:
          $ref: '#/components/schemas/Classification'
        parent:
          type: object
          description: For dependent entities, the sovereign parent.
          properties:
            alpha_2:
              type: string
            alpha_3:
              type: string
        memberships:
          $ref: '#/components/schemas/Memberships'
        government_type:
          type: string
          description: Dynamic field.
        leaders:
          type: array
          description: 'Premium dynamic field (Personal plans and above). On the free plan the array carries
            a single upgrade-notice object instead of leader records, so all leaf fields must stay optional.

            '
          items:
            $ref: '#/components/schemas/Leader'
        links:
          type: object
          properties:
            official:
              type: string
            wikipedia:
              type: string
            open_street_maps:
              type: string
            google_maps:
              type: string
    Names:
      type: object
      properties:
        common:
          type: string
        official:
          type: string
        alternates:
          type: array
          items:
            type: string
        native:
          type: object
          description: Keyed by ISO 639-3 language code.
          additionalProperties:
            $ref: '#/components/schemas/NameForms'
        translations:
          type: object
          description: Keyed by ISO 639-3 language code. Heavy branch; consider response_fields_omit=names.translations.
          additionalProperties:
            $ref: '#/components/schemas/NameForms'
    NameForms:
      type: object
      properties:
        common:
          type: string
        official:
          type: string
    Capital:
      type: object
      properties:
        name:
          type: string
        coordinates:
          $ref: '#/components/schemas/Coordinates'
        attributes:
          type: object
          description: Role flags. Nesting under `attributes` verified against a live v5 record.
          properties:
            primary:
              type: boolean
            constitutional:
              type: boolean
            administrative:
              type: boolean
            executive:
              type: boolean
            legislative:
              type: boolean
            judicial:
              type: boolean
    Demonym:
      type: object
      properties:
        m:
          type: string
        f:
          type: string
    Codes:
      type: object
      properties:
        alpha_2:
          type: string
        alpha_3:
          type: string
        ccn3:
          type: string
        fips:
          type: string
        gec:
          type: string
        cioc:
          type: string
        fifa:
          type: string
    Flag:
      type: object
      properties:
        emoji:
          type: string
        unicode:
          type: string
        html_entity:
          type: string
        url_png:
          type: string
        url_svg:
          type: string
        description:
          type: string
        colors:
          type: object
          properties:
            dominant:
              type: string
            prominent:
              type: string
            palette:
              type: array
              items:
                type: object
                properties:
                  hex:
                    type: string
                  proportion:
                    type: number
            swatches:
              type: object
              description: All six roles always present; null when no matching color.
              properties:
                vibrant:
                  type: string
                  nullable: true
                muted:
                  type: string
                  nullable: true
                dark_vibrant:
                  type: string
                  nullable: true
                dark_muted:
                  type: string
                  nullable: true
                light_vibrant:
                  type: string
                  nullable: true
                light_muted:
                  type: string
                  nullable: true
    Coordinates:
      type: object
      properties:
        lat:
          type: number
        lng:
          type: number
    Language:
      type: object
      properties:
        name:
          type: string
          description: English name. Verified lookup path (languages.name).
        native_name:
          type: string
          description: x-unverified key name.
        bcp_47:
          type: string
          description: x-unverified key name.
        iso_639_1:
          type: string
          description: x-unverified key name.
        iso_639_3:
          type: string
          description: x-unverified key name.
    Currency:
      type: object
      properties:
        code:
          type: string
          description: ISO 4217 code. Verified lookup path (currencies.code).
        name:
          type: string
          description: x-unverified key name.
        symbol:
          type: string
          description: x-unverified key name.
    DateConventions:
      type: object
      properties:
        start_of_week:
          type: string
        academic_year_start:
          $ref: '#/components/schemas/MonthDay'
        fiscal_year_start:
          type: object
          properties:
            government:
              $ref: '#/components/schemas/MonthDay'
            corporate:
              allOf:
              - $ref: '#/components/schemas/MonthDay'
              - type: object
                properties:
                  basis:
                    type: string
                    enum:
                    - mandated
                    - default
                    - convention
            personal:
              $ref: '#/components/schemas/MonthDay'
    MonthDay:
      type: object
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        day:
          type: integer
          minimum: 1
          maximum: 31
    Classification:
      type: object
      properties:
        sovereign:
          type: boolean
          description: Replaces v3.1's `independent` (verified against a live v5 record).
        un_member:
          type: boolean
        un_observer:
          type: boolean
        disputed:
          type: boolean
        dependency:
          type: boolean
        dependency_type:
          type: string
        iso_status:
          type: string
          enum:
          - official
          - user_assigned
    Memberships:
      type: object
      properties:
        un:
          type: boolean
        eu:
          type: boolean
        eurozone:
          type: boolean
        schengen:
          type: boolean
        nato:
          type: boolean
        commonwealth:
          type: boolean
        oecd:
          type: boolean
        g7:
          type: boolean
        g20:
          type: boolean
        brics:
          type: boolean
        opec:
          type: boolean
        african_union:
          type: boolean
        asean:
          type: boolean
        arab_league:
          type: boolean
    Leader:
      type: object
      description: Premium field. Per docs each leader includes assets, attributes, links, name, and title;
        exact sub-shapes are x-unverified.
      properties:
        name:
          type: string
        title:
          type: string
        assets:
          type: object
          additionalProperties: true
        attributes:
          type: object
          additionalProperties: true
        links:
          type: object
          additionalProperties: true